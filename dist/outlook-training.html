<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic vs New Outlook – Interactive Training</title>
<meta name="description" content="Hands-on training that teaches the differences between classic Outlook and new Outlook for Windows, using a safe simulator with fictional data.">
<style>
/* ==========================================================================
   Classic vs New Outlook training — styles
   1. tokens  2. app shell  3. coach/lessons  4. quiz  5. simulator
   ========================================================================== */

/* ------------------------------------------------------------- 1. tokens */
:root {
  --bg: #f4f5f7; --card: #fff; --ink: #1b1a19; --muted: #5a5958; --line: #e1dfdd; --soft: #f3f2f1;
  --brand: #0f6cbd; --brand-d: #0a4f8c; --brand-l: #e8f1fa;
  --ok: #0e700e; --ok-bg: #e9f5e9; --warn: #8a5300; --warn-bg: #fff4ce; --bad: #a4262c; --bad-bg: #fde7e9; --info-bg: #e8f1fa;
  --hl: #ffb900; --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --font: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .4em; font-weight: 600; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
p { margin: 0 0 .8em; }
a { color: var(--brand-d); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
:focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: #fff; padding: 8px 14px; border-radius: 6px; z-index: 200; }
.skip:focus { left: 8px; }

/* ----------------------------------------------------------- 2. app shell */
.top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 50; }
.top-in { max-width: 1480px; margin: 0 auto; padding: 8px 20px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.brand b { display: block; line-height: 1.15; } .brand small { color: var(--muted); font-size: .78rem; }
.topnav { display: flex; gap: 2px; flex: 1; flex-wrap: wrap; }
.topnav a { padding: 7px 12px; border-radius: 6px; text-decoration: none; color: var(--ink); font-weight: 500; }
.topnav a:hover { background: var(--soft); }
.topnav a[aria-current="page"] { color: var(--brand-d); background: var(--brand-l); }
.top-prog { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.pbar { width: 120px; height: 8px; border-radius: 99px; background: #e1dfdd; overflow: hidden; }
.pbar span, .coach-bar span { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .3s; }
.main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; outline: none; }
.main.wide { max-width: 1480px; }
.foot { max-width: 1480px; margin: 0 auto; padding: 14px 20px 30px; color: var(--muted); font-size: .85rem; display: flex; gap: 14px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.banner { padding: 8px 20px; text-align: center; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: .75rem; font-weight: 600; color: var(--brand-d); margin: 0 0 4px; }
.lead { font-size: 1.1rem; color: #323130; }
.narrow-text { max-width: 760px; }
.sec { margin: 26px 0 12px; }
.crumb { font-size: .88rem; color: var(--muted); margin-bottom: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: 1px solid #8a8886; background: #fff; border-radius: 6px; font-weight: 600; text-decoration: none; color: var(--ink); line-height: 1.25; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-d); border-color: var(--brand-d); }
.btn.big { padding: 11px 22px; font-size: 1rem; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn.link { border-color: transparent; background: none; color: var(--brand-d); text-decoration: underline; padding: 6px 8px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.hero { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: center; background: linear-gradient(135deg, #0b3a6b, #0f6cbd 70%); color: #fff; border-radius: 16px; padding: 34px 36px; margin-bottom: 8px; }
.hero h1 { font-size: 2.15rem; margin-bottom: .3em; }
.hero .eyebrow { color: #bcd9f3; } .hero .lead { color: #e6f0fa; max-width: 640px; }
.hero-cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.hero .btn.primary { background: #fff; color: #0a3d6e; border-color: #fff; }
.hero .btn.primary:hover { background: #e8f1fa; }
.hero .btn:not(.primary) { background: transparent; color: #fff; border-color: #fff; }
.hero .btn:not(.primary):hover { background: rgba(255,255,255,.14); }
.hero-prog { display: flex; align-items: center; gap: 18px; color: var(--ink); }
.ring { --p: 0; width: 104px; height: 104px; border-radius: 50%; background: conic-gradient(var(--brand) calc(var(--p) * 1%), #e1dfdd 0); display: grid; place-items: center; position: relative; flex: none; text-align: center; }
.ring::before { content: ""; position: absolute; inset: 10px; background: #fff; border-radius: 50%; }
.ring b, .ring small { position: relative; display: block; line-height: 1.1; } .ring b { font-size: 1.35rem; } .ring small { color: var(--muted); font-size: .72rem; }
.ring.good { background: conic-gradient(var(--ok) calc(var(--p) * 1%), #e1dfdd 0); } .ring.warn { background: conic-gradient(#c19c00 calc(var(--p) * 1%), #e1dfdd 0); }
.stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .92rem; }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.dash-side { display: grid; gap: 16px; position: sticky; top: 76px; }
.mod { margin-bottom: 16px; }
.mod-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.mod-h h3 { margin: 0; font-size: 1.2rem; } .mod-h p { margin: 2px 0 8px; }
.mod-count { background: var(--soft); border-radius: 99px; padding: 2px 10px; font-weight: 600; font-size: .85rem; }
.lesson-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-list li + li { border-top: 1px solid var(--line); }
.ll { display: flex; align-items: center; gap: 12px; padding: 10px 6px; text-decoration: none; color: var(--ink); border-radius: 6px; }
.ll:hover { background: var(--soft); }
.ll-n { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-weight: 600; font-size: .85rem; flex: none; }
.ll-n.done { background: var(--ok); color: #fff; }
.ll-t { flex: 1; min-width: 0; } .ll-t b, .ll-t small { display: block; } .ll-t small { color: var(--muted); }
.ll-go { color: var(--brand-d); font-weight: 600; display: inline-flex; align-items: center; gap: 2px; }
.mod-quiz { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px 12px; background: var(--soft); border-radius: 8px; }
.mod-quiz > div:first-child { flex: 1; } .mod-quiz small { display: block; color: var(--muted); }
.chip { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.chip-ok { background: var(--ok-bg); color: var(--ok); } .chip-todo { background: #edebe9; color: #4a4846; } .chip-warn { background: var(--warn-bg); color: var(--warn); }
.todo { padding-left: 18px; margin: 6px 0 0; } .todo li { margin: 3px 0; }
.filter-row { display: flex; gap: 10px; align-items: center; margin: 8px 0 12px; }
.inp { padding: 7px 10px; border: 1px solid #8a8886; border-radius: 6px; background: #fff; min-width: 240px; }
.tbl, .cmp { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl th, .tbl td, .cmp th, .cmp td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl thead th, .cmp thead th { background: var(--soft); font-weight: 600; position: sticky; top: 0; }
.cmp tbody th { font-weight: 600; width: 20%; }
.cmp-wrap { overflow-x: auto; max-height: 560px; border: 1px solid var(--line); border-radius: 8px; }
.coach .cmp-wrap { max-height: 360px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.tag-same { background: #e9f5e9; color: #0e700e; } .tag-moved { background: #e8f1fa; color: #0a4f8c; } .tag-different { background: #fff4ce; color: #7a4a00; }
.tag-new { background: #f1e9fb; color: #5c2e91; } .tag-missing { background: #fde7e9; color: #a4262c; } .tag-partial { background: #fff4ce; color: #7a4a00; }
.st-avail { background: #e9f5e9; color: #0e700e; } .st-partial { background: #fff4ce; color: #7a4a00; } .st-no { background: #fde7e9; color: #a4262c; }
.bul { padding-left: 20px; } .bul li { margin: 6px 0; }
.sum-grid { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.modal-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 300; padding: 16px; }
.modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }

/* --------------------------------------------------------- 3. coach/lesson */
.lesson-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.lesson-head h1 { margin: 0; font-size: 1.7rem; }
.lesson-nav { display: flex; gap: 8px; }
.lesson-grid { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 18px; align-items: start; }
.coach { position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow: auto; }
.coach-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.coach-count { color: var(--muted); font-size: .85rem; }
.coach-bar { height: 6px; background: #e1dfdd; border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
.coach-title { font-size: 1.25rem; margin: 0 0 8px; outline: none; }
.coach-do { font-size: 1.02rem; margin-bottom: 12px; }
.coach-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.coach-note { color: var(--muted); font-size: .85rem; margin-bottom: 8px; }
.coach-steps { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; font-size: .88rem; }
.coach-steps summary { cursor: pointer; font-weight: 600; }
.coach-steps ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.coach-steps li { padding-left: 24px; position: relative; color: var(--muted); }
.coach-steps li::before { content: ""; position: absolute; left: 4px; top: 5px; width: 11px; height: 11px; border: 2px solid #a19f9d; border-radius: 50%; }
.coach-steps li.done { color: var(--ink); } .coach-steps li.done::before { background: var(--ok); border-color: var(--ok); }
.coach-steps li.cur { color: var(--ink); font-weight: 600; } .coach-steps li.cur::before { border-color: var(--brand); background: #fff; box-shadow: inset 0 0 0 2px var(--brand); }
.coach-foot { margin-top: 8px; }
.part { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 700; }
.part-classic { background: #dbe7f5; color: #0b3a6b; } .part-new { background: #e3f2f1; color: #04585a; } .part-done, .part-intro { background: var(--ok-bg); color: var(--ok); }
.part-intro { background: var(--brand-l); color: var(--brand-d); }
.coach .plist { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 6px; }
.fb { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: .95rem; align-items: flex-start; }
.fb svg { flex: none; margin-top: 2px; }
.fb.ok { background: var(--ok-bg); color: #0b4a0b; } .fb.bad { background: var(--bad-bg); color: #6e1a1f; } .fb.info { background: var(--info-bg); color: #0a3d6e; } .fb.hint { background: var(--warn-bg); color: #5e3a00; }
.q { border: 0; margin: 0; padding: 0; }
.q legend { padding: 0; }
.q-opt { display: flex; align-items: center; gap: 10px; border: 1px solid #c8c6c4; border-radius: 8px; padding: 10px 12px; margin: 8px 0; cursor: pointer; background: #fff; }
.q-opt:hover { background: var(--soft); }
.q-opt input { flex: none; width: 18px; height: 18px; accent-color: var(--brand); }
.q-opt.right { border-color: var(--ok); background: var(--ok-bg); } .q-opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.q-opt .mark { margin-left: auto; font-style: normal; font-size: .8rem; font-weight: 700; color: var(--ok); display: inline-flex; gap: 4px; align-items: center; }
.q-opt .mark.bad { color: var(--bad); }
.simwrap { min-width: 0; }
.sim-label { font-size: .8rem; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
.sim-root { height: 740px; border: 1px solid #c8c6c4; border-radius: 10px; overflow: hidden; background: #fff; position: relative; box-shadow: var(--shadow); }
.sim-root.tall { height: 780px; }

/* ---------------------------------------------------------------- 4. quiz */
.quiz-card { max-width: 780px; margin: 0 auto; }
.qtext { font-size: 1.3rem; margin: 0 0 6px; outline: none; }
.score { display: flex; gap: 22px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
.result-h { outline: none; }
.review { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
.review li { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.bad-ans { color: var(--bad); font-size: .92rem; } .good-ans { color: var(--ok); font-size: .92rem; font-weight: 600; }

/* ======================================================= 5. SIMULATOR === */
.sim { --acc: #0f6cbd; --acc-d: #0a4f8c; --acc-l: #e6f0fa; --bg: #fff; --bg2: #f6f5f4; --bg3: #edebe9; --fg: #242424; --fg2: #616161; --bd: #d1d1d1; --rail: #f0efee; --sel: #dbe9f8; --row-hover: #f5f5f5;
  position: relative; display: flex; flex-direction: column; height: 100%; width: 100%; background: var(--bg); color: var(--fg); font-size: 13px; line-height: 1.35; overflow: hidden; }
.sim * { box-sizing: border-box; }
.sim button { font-size: inherit; }
.sim[data-accent="teal"] { --acc: #038387; --acc-d: #02686b; --acc-l: #dff3f3; --sel: #d3ecec; }
.sim[data-accent="plum"] { --acc: #8764b8; --acc-d: #6b4a9c; --acc-l: #eee8f7; --sel: #e4daf2; }
.sim[data-accent="forest"] { --acc: #498205; --acc-d: #386604; --acc-l: #e6f1d9; --sel: #dcebc9; }
.sim.dark { --bg: #1f1f1f; --bg2: #292929; --bg3: #333; --fg: #f0f0f0; --fg2: #b8b8b8; --bd: #484848; --rail: #181818; --sel: #263a52; --row-hover: #2b2b2b; --acc-l: #1c2c3d; }
.sim[data-accent="teal"].dark { --sel: #1d3b3d; --acc-l: #173032; } .sim[data-accent="plum"].dark { --sel: #34294a; --acc-l: #2a2238; } .sim[data-accent="forest"].dark { --sel: #2c3d1d; --acc-l: #232f18; }
.sim[data-mode="classic"] { --acc: #185abd; --acc-d: #0f4694; --acc-l: #e3ecf8; --sel: #cde0f6; }
.sim[data-mode="classic"].dark { --acc: #5b9bd9; --sel: #2b4560; --acc-l: #1f3248; }

/* title bar */
.sim-titlebar { flex: none; }
.tb { display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 40px; }
.tb-classic { background: #185abd; color: #fff; }
.sim.dark .tb-classic { background: #2b2b2b; }
.tb-new { background: var(--acc); color: #fff; }
.sim.dark .tb-new { background: #292929; border-bottom: 1px solid var(--bd); }
.tb-left, .tb-right { display: flex; align-items: center; gap: 6px; }
.tb-left { min-width: 0; flex: 0 1 auto; } .tb-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 8px; opacity: .95; }
.app-badge { width: 22px; height: 22px; border-radius: 4px; background: #fff; color: #185abd; font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.sim .brand { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #fff; text-decoration: none; }
.tb-btn { background: transparent; border: 0; color: #fff; width: 30px; height: 30px; border-radius: 4px; display: grid; place-items: center; padding: 0; }
.tb-btn:hover { background: rgba(255,255,255,.18); } .tb-btn.dim { opacity: .55; }
.tb-btn.hamb { display: none; }
.tb-search { flex: 1; max-width: 520px; margin: 0 auto; position: relative; display: flex; align-items: center; }
.tb-search input { width: 100%; height: 28px; border: 0; border-radius: 4px; padding: 0 28px 0 30px; background: rgba(255,255,255,.95); color: #242424; }
.sim.dark .tb-search input { background: #3b3b3b; color: #f0f0f0; }
.tb-sic { position: absolute; left: 8px; color: #616161; pointer-events: none; }
.tb-clear { position: absolute; right: 4px; background: none; border: 0; color: #616161; width: 22px; height: 22px; border-radius: 3px; padding: 0; display: grid; place-items: center; }
.tb-clear:hover { background: rgba(0,0,0,.1); }
.tb-right { margin-left: auto; }
.tb-switch-label { font-size: 12px; white-space: nowrap; }
.switch, .tgl .knob { position: relative; }
.switch { width: 40px; height: 20px; border-radius: 99px; border: 2px solid #fff; background: transparent; padding: 0; flex: none; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: #fff; } .switch.on .knob { left: 22px; background: var(--acc); }
.suggest-host { position: absolute; top: 100%; left: 0; right: 0; z-index: 30; }
.suggest { background: var(--bg); color: var(--fg); border: 1px solid var(--bd); border-radius: 6px; margin-top: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.2); overflow: hidden; }
.sg { display: flex; gap: 8px; align-items: center; width: 100%; background: none; border: 0; padding: 8px 12px; text-align: left; color: inherit; }
.sg:hover, .sg:focus-visible { background: var(--sel); }

/* ribbon */
.sim-ribbonwrap { flex: none; background: var(--bg2); border-bottom: 1px solid var(--bd); }
.sim[data-mode="new"] .sim-ribbonwrap { background: var(--bg); }
.rtabs { display: flex; gap: 2px; padding: 0 8px; align-items: flex-end; }
.rtab { background: none; border: 0; padding: 7px 12px 6px; border-bottom: 3px solid transparent; color: var(--fg); }
.rtab:hover { background: rgba(0,0,0,.05); }
.rtab.on { border-bottom-color: var(--acc); font-weight: 600; color: var(--acc-d); }
.sim.dark .rtab.on { color: #9ec6f0; }
.rtab.file { background: #185abd; color: #fff; border-radius: 4px 4px 0 0; margin-right: 4px; padding: 7px 16px; }
.rtab.file:hover { background: #0f4694; }
.rtab.ctx { color: #a4262c; }
.rpanel { display: flex; align-items: stretch; gap: 0; padding: 6px 8px 4px; min-height: 76px; overflow-x: auto; background: var(--bg); border-top: 1px solid var(--bd); }
.rg { display: flex; flex-direction: column; padding: 0 8px; border-right: 1px solid var(--bd); flex: none; }
.rg:last-child { border-right: 0; }
.rg-items { display: flex; gap: 2px; align-items: flex-start; flex: 1; flex-wrap: wrap; max-width: 330px; }
.rg-label { text-align: center; color: var(--fg2); font-size: 11px; padding-top: 2px; }
.rb { display: inline-flex; align-items: center; gap: 4px; background: none; border: 1px solid transparent; border-radius: 4px; color: var(--fg); padding: 3px 6px; white-space: nowrap; }
.rb:hover { background: var(--bg3); } .rb.on { background: var(--sel); border-color: var(--acc); }
.rb.soft { opacity: .45; }
.rb-l { flex-direction: column; width: 62px; min-height: 52px; justify-content: flex-start; padding: 4px 3px; }
.rb-l .rb-l, .rb-l .rb-l { font-size: 11px; }
.rb-l span.rb-l { white-space: normal; text-align: center; line-height: 1.1; min-height: auto; width: auto; flex-direction: row; display: inline; padding: 0; }
.rb-s { font-size: 12px; }
.rb-ic { flex: none; } .rb-caret { opacity: .7; }
.rb.primary { background: var(--acc); color: #fff; border-color: var(--acc); } .rb.primary:hover { background: var(--acc-d); }

  /* ------------------------------------------------------------------ build */
  S.build = function () {
    var r = this.root;
    r.innerHTML =
      '<div class="sim" data-mode="classic">' +
      '<div class="sim-titlebar"></div>' +
      '<div class="sim-ribbonwrap"><div class="sim-ribbon"></div></div>' +
      '<div class="sim-body">' +
      '<nav class="sim-rail" aria-label="Apps"></nav>' +
      '<aside class="sim-folders" aria-label="Folder pane"></aside>' +
      '<main class="sim-main"></main>' +
      '<aside class="sim-side" aria-label="My Day"></aside>' +
      '<div class="sim-drawer-scrim" data-act="drawer-close"></div>' +
      '<div class="sim-compose-host"></div>' +
      '</div>' +
      '<div class="sim-status" role="status"></div>' +
      '<div class="sim-dialog-host"></div>' +
      '<div class="sim-menu-host"></div>' +
      '<div class="sim-toast-host" aria-live="polite"></div>' +
      '<div class="sim-callout-host"></div>' +
      '</div>';
    var q = function (c) { return r.querySelector(c); };
    this.el = {
      sim: q('.sim'), titlebar: q('.sim-titlebar'), ribbon: q('.sim-ribbon'), body: q('.sim-body'), rail: q('.sim-rail'),
      folders: q('.sim-folders'), main: q('.sim-main'), side: q('.sim-side'), compose: q('.sim-compose-host'),
      status: q('.sim-status'), dialog: q('.sim-dialog-host'), menu: q('.sim-menu-host'), toast: q('.sim-toast-host'),
      callout: q('.sim-callout-host')
    };
    this.bind();
  };

  S.bind = function () {
    var self = this, r = this.root;
    r.addEventListener('click', function (e) { self.onClick(e); });
    r.addEventListener('keydown', function (e) { self.onKey(e); });
    r.addEventListener('input', function (e) { self.onInput(e); });
    r.addEventListener('focusin', function (e) { self.onFocusIn(e); });
    r.addEventListener('change', function (e) { if (self.onChange) self.onChange(e); });
    r.addEventListener('contextmenu', function (e) { self.onContext(e); });
    r.addEventListener('dragstart', function (e) { self.onDragStart(e); });
    r.addEventListener('dragover', function (e) {
      var t = e.target.closest && e.target.closest('[data-drop]');
      if (t && self.dragId) { e.preventDefault(); t.classList.add('drop-over'); }
    });
    r.addEventListener('dragleave', function (e) {
      var t = e.target.closest && e.target.closest('[data-drop]');
      if (t) t.classList.remove('drop-over');
    });
    r.addEventListener('drop', function (e) { self.onDrop(e); });
    r.addEventListener('dragend', function () { self.dragId = null; U.$$('.drop-over', r).forEach(function (n) { n.classList.remove('drop-over'); }); });
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver(function () { self.measure(); });
      this.ro.observe(r);
    } else {
      window.addEventListener('resize', function () { self.measure(); });
    }
  };

  S.measure = function () {
    var w = this.root.clientWidth || 0;
    var narrow = w > 0 && w < 760;
    if (narrow !== this.ui.narrow) {
      this.ui.narrow = narrow;
      this.el.sim.classList.toggle('narrow', narrow);
      this.render();
    }
    this.el.sim.classList.toggle('compact-w', w > 0 && w < 1000);
  };

  S.destroy = function () {
    this.clearTimers();
    if (this.ro) this.ro.disconnect();
    this.root.innerHTML = '';
  };

  S.clearTimers = function () {
    this.timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
    this.timers = [];
  };
  S.later = function (fn, ms) {
    var self = this, id = setTimeout(function () {
      self.timers = self.timers.filter(function (t) { return t !== id; });
      fn();
    }, ms);
    this.timers.push(id);
    return id;
  };

  /* ------------------------------------------------------------------ state */
  S.reset = function (opts) {
    opts = opts || {};
    this.clearTimers();
    this.s = OT.data.create();
    this.clock = 0;
    var mode = opts.mode || 'classic';
    this.ui = {
      mode: mode, app: 'mail', tab: 'home', prevTab: 'home', folder: 'inbox', sel: null,
      search: { query: '', active: false, scope: 'folder', filters: { unread: false, attach: false, flagged: false, from: null, date: null }, tab: 'mail' },
      filter: 'all', sort: 'date', menu: null, dialog: null, settings: null, backstage: null,
      compose: null, evform: null, calView: 'workweek', calDate: new Date(2026, 9, 26), selEvent: null,
      expanded: { inbox: true }, pane: 'list', drawer: false, undoStack: [], myday: false,
      inlineFolder: null, renaming: null, peopleSel: null, peopleQuery: '', narrow: this.ui ? this.ui.narrow : false,
      syncing: false, pending: []
    };
    this.el.compose.innerHTML = '';
    this.el.dialog.innerHTML = '';
    this.el.menu.innerHTML = '';
    this.el.toast.innerHTML = '';
    this.el.sim.classList.remove('has-compose', 'has-dialog');
    if (typeof opts.setup === 'function') opts.setup(this);
    this.measure();
    this.render();
  };

  S.isNew = function () { return this.ui.mode === 'new'; };
  S.cfg = function () { return this.s.settings[this.ui.mode]; };
  S.msg = function (id) { for (var i = 0; i < this.s.messages.length; i++) if (this.s.messages[i].id === id) return this.s.messages[i]; return null; };
  S.folder = function (id) { for (var i = 0; i < this.s.folders.length; i++) if (this.s.folders[i].id === id) return this.s.folders[i]; return null; };
  S.contact = function (id) { return this.s.contacts[id] || null; };
  S.event = function (id) { for (var i = 0; i < this.s.events.length; i++) if (this.s.events[i].id === id) return this.s.events[i]; return null; };
  S.nextId = function (p) { this.s.seq += 1; return p + this.s.seq; };
  S.tick = function () { this.clock += 1; return OT.data.NOW + this.clock * 60000; };
  S.me = function () { return this.s.contacts[this.s.me]; };
  S.name = function (id) { var c = this.contact(id); return c ? c.name : String(id); };
  S.recipientName = function (r) { return typeof r === 'string' ? this.name(r) : r.name; };
  S.folderName = function (id) { var f = this.folder(id); return f ? f.name : id; };
  S.emit = function (type, data) {
    var ev = data || {}; ev.type = type;
    OT.bus.emit('sim', ev);
  };
  S.rendered = function () { OT.bus.emit('sim-rendered', { sim: this }); };
  S.isDark = function () {
    var c = this.cfg();
    return this.isNew() ? c.theme === 'dark' : (c.officeTheme === 'darkgray' || c.officeTheme === 'black');
  };

  S.folderMessages = function (fid) {
    var isNew = this.isNew();
    return this.s.messages.filter(function (m) {
      if (fid === 'snoozed') return !!m.snoozed;
      if (m.snoozed && isNew) return false;
      return m.folder === fid;
    });
  };
  S.unreadCount = function (fid) {
    return this.folderMessages(fid).filter(function (m) { return !m.read && !m.draft; }).length;
  };
  S.childFolders = function (pid) { return this.s.folders.filter(function (f) { return (f.parent || null) === (pid || null) && !f.sys; }); };
  S.allFoldersFlat = function () {
    var out = [], self = this;
    this.s.folders.filter(function (f) { return f.sys; }).forEach(function (f) {
      out.push({ f: f, depth: 0 });
      (function walk(pid, d) { self.childFolders(pid).forEach(function (c) { out.push({ f: c, depth: d }); walk(c.id, d + 1); }); })(f.id, 1);
    });
    return out;
  };

  S.matchesText = function (m, q) {
    var self = this;
    var hay = (m.subject + ' ' + this.name(m.from) + ' ' + ((this.contact(m.from) || {}).email || '') + ' ' +
      (m.to || []).map(function (r) { return self.recipientName(r); }).join(' ') + ' ' + U.stripHtml(m.body) + ' ' +
      m.attachments.map(function (a) { return a.name; }).join(' ')).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (t) { return hay.indexOf(t) !== -1; });
  };

  S.searchActive = function () {
    var s = this.ui.search, f = s.filters;
    return !!(s.query.trim() || f.unread || f.attach || f.flagged || f.from || f.date);
  };

  S.listMessages = function () {
    var ui = this.ui, self = this, sr = ui.search, list;
    if (this.searchActive()) {
      var pool = this.s.messages.filter(function (m) { return !m.draft || sr.scope === 'mailbox'; });
      if (sr.scope === 'folder') {
        var fm = this.folderMessages(ui.folder);
        pool = pool.filter(function (m) { return fm.indexOf(m) !== -1; });
      }
      var q = sr.query.trim(), f = sr.filters;
      list = pool.filter(function (m) {
        if (q && !self.matchesText(m, q)) return false;
        if (f.unread && m.read) return false;
        if (f.attach && !m.attachments.length) return false;
        if (f.flagged && !m.flag) return false;
        if (f.from && m.from !== f.from) return false;
        if (f.date === 'week' && m.date < OT.data.NOW - 7 * 86400000) return false;
        if (f.date === 'today' && !U.sameDay(new Date(m.date), new Date(OT.data.NOW))) return false;
        return true;
      });
    } else {
      list = this.folderMessages(ui.folder);
    }
    if (ui.filter === 'unread') list = list.filter(function (m) { return !m.read; });
    if (ui.filter === 'flagged') list = list.filter(function (m) { return !!m.flag; });
    if (ui.filter === 'attach') list = list.filter(function (m) { return m.attachments.length > 0; });
    var s = ui.sort;
    list = list.slice().sort(function (a, b) {
      if (s === 'from') return self.name(a.from).localeCompare(self.name(b.from)) || b.date - a.date;
      if (s === 'subject') return a.subject.localeCompare(b.subject) || b.date - a.date;
      if (s === 'importance') return (b.important ? 1 : 0) - (a.important ? 1 : 0) || b.date - a.date;
      if (s === 'attach') return (b.attachments.length ? 1 : 0) - (a.attachments.length ? 1 : 0) || b.date - a.date;
      return b.date - a.date;
    });
    if (this.isNew() && s === 'date') {
      list = list.filter(function (m) { return m.pinned; }).concat(list.filter(function (m) { return !m.pinned; }));
    }
    return list;
  };

  /* ---------------------------------------------------------------- actions */
  S.setMode = function (mode, variant) {
    if (mode === this.ui.mode) return;
    if (this.ui.compose || this.ui.evform) this.closeCompose(true);
    this.closeMenu();
    this.ui.dialog = null; this.el.dialog.innerHTML = ''; this.el.sim.classList.remove('has-dialog');
    this.ui.settings = null; this.ui.backstage = null;
    this.ui.mode = mode; this.ui.tab = 'home'; this.ui.myday = false;
    this.ui.search.active = false;
    this.ui.inlineFolder = null; this.ui.renaming = null;
    if (mode === 'classic' && this.ui.folder === 'snoozed') this.ui.folder = 'inbox';
    this.ui.drawer = false;
    this.emit('toggle-mode', { mode: mode, variant: variant || null });
    this.render();
  };

  S.gotoApp = function (app) {
    this.closeMenu();
    if (this.ui.compose || this.ui.evform) this.closeCompose(true);
    this.ui.app = app; this.ui.tab = 'home'; this.ui.pane = 'list'; this.ui.drawer = false;
    this.ui.search.active = false;
    this.emit('app', { app: app });
    this.render();
  };

  S.selectFolder = function (id) {
    this.ui.folder = id; this.ui.sel = null; this.ui.pane = 'list'; this.ui.drawer = false;
    this.ui.filter = 'all';
    this.emit('folder-select', { id: id });
    this.render();
  };

  S.openMessage = function (id) {
    var m = this.msg(id); if (!m) return;
    if (m.draft) { this.editDraft(id); return; }
    this.ui.sel = id; this.ui.pane = 'read';
    if (!m.read) m.read = true;
    this.emit('open-message', { id: id });
    this.render();
  };

  S.pushUndo = function (entry) { this.ui.undoStack.push(entry); if (this.ui.undoStack.length > 10) this.ui.undoStack.shift(); };

  S.deleteMessage = function (id) {
    var m = this.msg(id); if (!m) return;
    var from = m.folder;
    if (from === 'deleted') {
      var self = this;
      this.confirm({
        title: 'Permanently delete?', text: 'This message will be permanently deleted from Deleted Items.', ok: 'Delete', cancel: 'Cancel',
        onOk: function () {
          self.s.messages = self.s.messages.filter(function (x) { return x.id !== id; });
          if (self.ui.sel === id) self.ui.sel = null;
          self.emit('delete-permanent', { id: id });
          self.render();
        }
      });
      return;
    }
    m.folder = 'deleted'; m.snoozed = null;
    if (this.ui.sel === id) { this.ui.sel = null; this.ui.pane = 'list'; }
    this.pushUndo({ type: 'delete', id: id, from: from });
    this.emit('delete', { id: id, from: from });
    if (this.isNew()) this.toast('Conversation moved to Deleted Items', { action: { label: 'Undo', act: 'undo' }, ms: 8000 });
    this.render();
  };

  S.moveMessage = function (id, to, via) {
    var m = this.msg(id), f = this.folder(to); if (!m || !f) return;
    var from = m.folder;
    if (from === to) { this.toast('The message is already in ' + f.name + '.'); return; }
    m.folder = to; m.snoozed = null;
    if (this.ui.sel === id && this.ui.folder !== to) { this.ui.sel = null; this.ui.pane = 'list'; }
    this.pushUndo({ type: 'move', id: id, from: from, to: to });
    this.emit('move', { id: id, from: from, to: to, via: via || 'menu' });
    this.toast('Moved to ' + f.name, this.isNew() ? { action: { label: 'Undo', act: 'undo' }, ms: 6000 } : {});
    this.render();
  };

  S.undo = function () {
    var u = this.ui.undoStack.pop();
    if (!u) { this.toast('Nothing to undo.'); return; }
    var m = this.msg(u.id);
    if (m) m.folder = u.from;
    this.emit('undo', { what: u.type, id: u.id, restoredTo: u.from });
    this.toast('Restored to ' + this.folderName(u.from));
    this.render();
  };

  S.toggleFlag = function (id, value) {
    var m = this.msg(id); if (!m) return;
    if (value === undefined) value = m.flag ? false : 'flagged';
    m.flag = value || null;
    this.emit('flag', { id: id, value: m.flag || false });
    this.render();
  };
  S.setRead = function (id, read) {
    var m = this.msg(id); if (!m) return;
    m.read = read;
    this.emit('read', { id: id, read: read });
    this.render();
  };
  S.togglePin = function (id) {
    var m = this.msg(id); if (!m) return;
    m.pinned = !m.pinned;
    this.emit('pin', { id: id, pinned: m.pinned });
    this.render();
  };
  S.setCategory = function (id, cat) {
    var m = this.msg(id); if (!m) return;
    m.category = cat || null;
    this.emit('category', { id: id, category: m.category });
    this.render();
  };
  S.snooze = function (id, label) {
    var m = this.msg(id); if (!m) return;
    m.snoozed = label;
    if (this.ui.sel === id) { this.ui.sel = null; this.ui.pane = 'list'; }
    this.emit('snooze', { id: id, until: label });
    this.toast('Snoozed until ' + label, { action: { label: 'Undo', act: 'unsnooze', id: id }, ms: 6000 });
    this.render();
  };
  S.unsnooze = function (id) {
    var m = this.msg(id); if (!m) return;
    m.snoozed = null;
    this.emit('unsnooze', { id: id });
    this.render();
  };
  S.sweep = function (id, action) {
    var m = this.msg(id); if (!m) return;
    var sender = m.from, self = this, n = 0;
    this.s.messages.forEach(function (x) {
      if (x.folder === 'inbox' && x.from === sender) { x.folder = action === 'delete' ? 'deleted' : 'archive'; n += 1; }
    });
    if (this.ui.sel && this.msg(this.ui.sel).folder !== this.ui.folder) this.ui.sel = null;
    this.emit('sweep', { id: id, action: action, count: n, sender: sender });
    this.toast('Swept ' + U.plural(n, 'message') + ' from ' + self.name(sender));
    this.render();
  };
  S.quickStepDone = function (id) {
    var m = this.msg(id); if (!m) return;
    m.read = true; m.folder = 'archive';
    if (this.ui.sel === id) { this.ui.sel = null; this.ui.pane = 'list'; }
    this.emit('quickstep', { name: 'Done', id: id });
    this.toast('Quick Step "Done": marked as read and moved to Archive');
    this.render();
  };
  S.markAllRead = function (fid) {
    var n = 0;
    this.folderMessages(fid).forEach(function (m) { if (!m.read) { m.read = true; n += 1; } });
    this.emit('mark-all-read', { folder: fid, count: n });
    this.toast(n ? 'Marked ' + U.plural(n, 'message') + ' as read' : 'Nothing to mark as read');
    this.render();
  };

  /* folders */
  S.createFolder = function (name, parent) {
    name = String(name || '').trim();
    if (!name) return { ok: false, error: 'Type a name for the new folder.' };
    var par = parent || 'inbox';
    var dup = this.s.folders.some(function (f) { return !f.sys && (f.parent || 'inbox') === par && f.name.toLowerCase() === name.toLowerCase(); });
    if (dup) return { ok: false, error: 'A folder with that name already exists. Use a different name.' };
    var id = 'f-' + this.nextId('c');
    this.s.folders.push({ id: id, name: name, parent: par });
    this.ui.expanded[par] = true;
    this.ui.drawer = false;
    this.ui.inlineFolder = null;
    this.emit('folder-create', { id: id, name: name, parent: par });
    this.render();
    return { ok: true, id: id };
  };
  S.renameFolder = function (id, name) {
    var f = this.folder(id); name = String(name || '').trim();
    if (!f || f.sys || !name) return false;
    f.name = name;
    this.emit('folder-rename', { id: id, name: name });
    this.render();
    return true;
  };
  S.deleteFolder = function (id) {
    var f = this.folder(id); if (!f || f.sys) return;
    var self = this;
    var ids = [id];
    (function walk(pid) { self.childFolders(pid).forEach(function (c) { ids.push(c.id); walk(c.id); }); })(id);
    this.s.messages.forEach(function (m) { if (ids.indexOf(m.folder) !== -1) m.folder = 'deleted'; });
    this.s.folders = this.s.folders.filter(function (x) { return ids.indexOf(x.id) === -1; });
    if (ids.indexOf(this.ui.folder) !== -1) { this.ui.folder = 'inbox'; this.ui.sel = null; }
    this.emit('folder-delete', { id: id });
    this.toast('Folder deleted. Its messages were moved to Deleted Items.');
    this.render();
  };

  /* search */
  S.runSearch = function (query) {
    this.ui.search.query = query; this.ui.search.active = true;
    this.emit('search', { query: query.trim(), scope: this.ui.search.scope });
    this.render();
  };
  S.setSearchFilter = function (key, value) {
    var f = this.ui.search.filters;
    f[key] = value;
    this.ui.search.active = true;
    this.emit('filter', { key: key, value: value });
    this.render();
  };
  S.closeSearch = function () {
    var s = this.ui.search;
    s.query = ''; s.active = false; s.tab = 'mail';
    s.filters = { unread: false, attach: false, flagged: false, from: null, date: null };
    if (this.ui.tab === 'search') this.ui.tab = this.ui.prevTab || 'home';
    this.emit('search-close', {});
    this.render();
  };
  S.setSearchScope = function (scope) {
    this.ui.search.scope = scope; this.ui.search.active = true;
    this.emit('search-scope', { scope: scope });
    this.render();
  };

  /* calendar */
  S.rsvp = function (eventId, resp, send) {
    var ev = this.event(eventId); if (!ev) return;
    ev.status = resp;
    ev.attendees.forEach(function (a) { if (a.id === 'jordan') a.resp = resp; });
    this.emit('rsvp', { id: eventId, resp: resp, send: send !== false });
    var msgs = { accepted: 'You accepted "' + ev.title + '".', tentative: 'You responded Tentative to "' + ev.title + '".', declined: 'You declined "' + ev.title + '".' };
    this.toast(msgs[resp] + (send === false ? ' No response was sent.' : ''));
    this.render();
  };
  S.deleteEvent = function (id) {
    var ev = this.event(id); if (!ev) return;
    this.s.events = this.s.events.filter(function (e) { return e.id !== id; });
    this.ui.selEvent = null;
    this.emit('event-delete', { id: id });
    this.toast('"' + ev.title + '" was removed from your calendar.');
    this.closeMenu();
    this.render();
  };
  S.calNav = function (dir) {
    var d = new Date(this.ui.calDate);
    var step = this.ui.calView === 'day' ? 1 : 7;
    d.setDate(d.getDate() + dir * step);
    this.ui.calDate = d;
    this.emit('cal-nav', { dir: dir });
    this.render();
  };
  S.calToday = function () {
    this.ui.calDate = new Date(2026, 9, 26);
    this.emit('cal-today', {});
    this.render();
  };
  S.setCalView = function (v) {
    this.ui.calView = v;
    this.emit('cal-view', { view: v });
    this.render();
  };

  /* rules */
  S.addRule = function (r) {
    var rule = { id: this.nextId('rule'), name: r.name, field: r.field, text: r.text, moveTo: r.moveTo, enabled: true };
    this.s.rules.push(rule);
    this.emit('rule-create', { rule: rule });
    this.render();
    return rule;
  };
  S.runRules = function (ruleId) {
    var self = this, moved = 0;
    this.s.rules.filter(function (r) { return r.enabled && (!ruleId || r.id === ruleId); }).forEach(function (r) {
      self.s.messages.forEach(function (m) {
        if (m.folder !== 'inbox') return;
        var hay = r.field === 'from' ? (self.name(m.from) + ' ' + ((self.contact(m.from) || {}).email || '')) : m.subject;
        if (hay.toLowerCase().indexOf(String(r.text).toLowerCase()) !== -1) { m.folder = r.moveTo; moved += 1; }
      });
    });
    this.emit('rule-run', { moved: moved });
    this.toast(moved ? 'Rule ran: moved ' + U.plural(moved, 'message') : 'Rule ran: no matching messages in the Inbox.');
    this.render();
  };

  S.sync = function () {
    var self = this;
    if (this.ui.syncing) return;
    this.ui.syncing = true;
    this.emit('sync', {});
    this.renderStatus();
    this.later(function () {
      self.ui.syncing = false;
      self.renderStatus();
      self.toast('All folders are up to date.');
    }, 900);
  };

      if (this.ui.settings) { this.closeSettings(); e.stopPropagation(); return; }
      if (this.ui.backstage) { this.closeBackstage(); e.stopPropagation(); return; }
      if (this.ui.compose || this.ui.evform) { this.requestCloseCompose(); e.stopPropagation(); return; }

      else if (key === 'Tab') { e.preventDefault(); this.closeMenu(); }

    if (t.id === 'sim-search') {
      if (key === 'Enter') { e.preventDefault(); this.runSearch(t.value); }
      return;
    }
    if (t.id === 'sim-newfolder') {
      if (key === 'Enter') { e.preventDefault(); this.commitInlineFolder(t.value); }
      else if (key === 'Escape') { this.ui.inlineFolder = null; this.render(); }
      return;
    }
    if (t.id === 'sim-rename') {
      if (key === 'Enter') { e.preventDefault(); this.renameFolder(this.ui.renaming, t.value); this.ui.renaming = null; this.render(); }
      else if (key === 'Escape') { this.ui.renaming = null; this.render(); }
      return;

    if (t.classList && t.classList.contains('row')) {
      var rows = U.$$('.sim-main .row', this.root), ri = rows.indexOf(t);
      if (key === 'ArrowDown') { e.preventDefault(); if (rows[ri + 1]) rows[ri + 1].focus(); }
      else if (key === 'ArrowUp') { e.preventDefault(); if (rows[ri - 1]) rows[ri - 1].focus(); }
      else if (key === 'Enter' || key === ' ') { e.preventDefault(); this.openMessage(t.dataset.id); var again = this.root.querySelector('.row[data-id="' + t.dataset.id + '"]'); if (again) again.focus(); }
      else if (key === 'Delete') { e.preventDefault(); this.deleteMessage(t.dataset.id); }
    }
  };

  S.commitInlineFolder = function (name) {
    var res = this.createFolder(name, this.ui.inlineFolder);
    if (res.ok) { this.ui.inlineFolder = null; this.render(); }

  S.onContext = function (e) {
    var t = e.target.closest && e.target.closest('[data-ctx]');
    if (!t) return;
    e.preventDefault();
    var kind = t.dataset.ctx;
    this.openMenu(kind + '-context', t, this.menuItems(kind + '-context', { id: t.dataset.id }), { at: { x: e.clientX, y: e.clientY }, label: kind + ' menu' });
  };

  S.onDragStart = function (e) {
    var t = e.target.closest && e.target.closest('.row[data-id]');
    if (!t) return;
    this.dragId = t.dataset.id;
    try { e.dataTransfer.setData('text/plain', t.dataset.id); e.dataTransfer.effectAllowed = 'move'; } catch (x) { /* ignore */ }
  };
  S.onDrop = function (e) {
    var t = e.target.closest && e.target.closest('[data-drop]');

    e.preventDefault();
    var id = this.dragId; this.dragId = null;
    U.$$('.drop-over', this.root).forEach(function (n) { n.classList.remove('drop-over'); });

  };
})();

<script>

    return '<div class="sr-bar"><div class="sr-tabs" role="tablist"><button type="button" role="tab" class="mt' + (sr.tab === 'mail' ? ' on' : '') + '" aria-selected="' + (sr.tab === 'mail') + '" data-act="search-tab" data-arg="mail" data-t="sr-tab-mail">Mail</button>' +
      '<button type="button" role="tab" class="mt' + (sr.tab === 'files' ? ' on' : '') + '" aria-selected="' + (sr.tab === 'files') + '" data-act="search-tab" data-arg="files" data-t="sr-tab-files">Files</button><span class="sr-count">' + U.plural(n, 'result') + '</span></div>' +
      '<div class="chips" role="group" aria-label="Search refiners">' +
      '<button type="button" class="chip" data-act="menu" data-menu="search-scope-new" aria-haspopup="menu" aria-expanded="false" data-t="chip-scope">In: ' + (sr.scope === 'folder' ? 'Current folder' : 'All folders') + ' ' + I('chev-down', 10) + '</button>' +
      '<button type="button" class="chip' + (f.from ? ' on' : '') + '" data-act="menu" data-menu="search-from" aria-haspopup="menu" aria-expanded="false" data-t="chip-from">From' + (f.from ? ': ' + esc(this.name(f.from)) : '') + ' ' + I('chev-down', 10) + '</button>' +
      '<button type="button" class="chip' + (f.attach ? ' on' : '') + '" data-act="search-toggle" data-arg="attach" aria-pressed="' + (!!f.attach) + '" data-t="chip-attach">' + I('attach', 12) + ' Has files</button>' +
      '<button type="button" class="chip' + (f.unread ? ' on' : '') + '" data-act="search-toggle" data-arg="unread" aria-pressed="' + (!!f.unread) + '" data-t="chip-unread">Unread</button>' +
      '<button type="button" class="chip' + (f.flagged ? ' on' : '') + '" data-act="search-toggle" data-arg="flagged" aria-pressed="' + (!!f.flagged) + '" data-t="chip-flagged">Flagged</button>' +
      '<button type="button" class="chip' + (f.date ? ' on' : '') + '" data-act="menu" data-menu="search-date" aria-haspopup="menu" aria-expanded="false" data-t="chip-date">Date' + (f.date ? ': ' + (f.date === 'week' ? 'This week' : 'Today') : '') + ' ' + I('chev-down', 10) + '</button>' +
      '<button type="button" class="chip clear" data-act="search-clear" data-t="chip-clear">' + I('x', 11) + ' Clear</button></div></div>';
  };

  S.fileIcon = function (ext) {
    var color = { xlsx: '#107c41', docx: '#185abd', pdf: '#d13438', png: '#8764b8', txt: '#5c5c5c' }[ext] || '#5c5c5c';
    return '<span class="fi" style="background:' + color + '" aria-hidden="true">' + esc(ext.toUpperCase().slice(0, 4)) + '</span>';
  };

  S.conflictsFor = function (ev) {
    return this.s.events.filter(function (o) {
      return o.id !== ev.id && o.status !== 'declined' && o.status !== 'pending' && o.start < ev.end && o.end > ev.start;
    });
  };

  S.tplInvite = function (m) {
    var ev = this.event(m.inviteId), self = this;
    if (!ev) return '';
    var d = new Date(ev.start), e = new Date(ev.end);
    var when = U.fmtDate(d) + ', ' + U.fmtTime(d) + ' – ' + U.fmtTime(e);
    var conf = this.conflictsFor(ev).filter(function () { return ev.status === 'pending' || true; });
    var responded = ev.status !== 'pending';
    var resp = '';
    var respText = { accepted: 'You accepted this meeting.', tentative: 'You responded Tentative to this meeting.', declined: 'You declined this meeting.' }[ev.status];
    if (responded) resp = '<div class="inv-resp" role="status">' + I('check', 14) + ' ' + respText + '</div>';
    var btns = ['accepted', 'tentative', 'declined'].map(function (r) {
      var label = { accepted: 'Accept', tentative: 'Tentative', declined: 'Decline' }[r];
      var t = { accepted: 'rsvp-accept', tentative: 'rsvp-tentative', declined: 'rsvp-decline' }[r];
      return '<button type="button" class="inv-btn ' + r + (ev.status === r ? ' chosen' : '') + '" data-act="rsvp" data-id="' + ev.id + '" data-arg="' + r + '" data-t="' + t + '" aria-haspopup="' + (self.isNew() ? 'false' : 'menu') + '">' + label + (self.isNew() ? '' : ' ' + I('chev-down', 10)) + '</button>';
    }).join('');
    return '<div class="invite" aria-label="Meeting invitation"><div class="inv-title">' + I('calendar', 16) + '<b>' + esc(ev.title) + '</b></div>' +
      '<div class="inv-line">' + I('clock', 13) + ' ' + esc(when) + '</div>' +
      '<div class="inv-line">' + I(ev.teams ? 'video' : 'location', 13) + ' ' + esc(ev.location || 'No location') + '</div>' +
      (conf.length ? '<div class="inv-conf" role="alert">' + I('flag', 13) + ' Conflicts with: ' + conf.map(function (c) { return esc(c.title) + ' (' + U.fmtTime(new Date(c.start)) + '–' + U.fmtTime(new Date(c.end)) + ')'; }).join(', ') + '</div>' : '') +
      '<div class="inv-actions" role="group" aria-label="Respond to meeting">' + btns + '</div>' + resp + '</div>';
  };

  S.tplReading = function (m, single) {
    var self = this, isNew = this.isNew();
    if (!m || m.folder === 'nope') {
      return '<div class="rp-empty">' + I(isNew ? 'mail-read' : 'mail', 40) + '<p>Select an item to read</p><small>Nothing is selected</small></div>';
    }
    var c = this.contact(m.from) || { name: String(m.from), email: '' };
    var outgoing = m.folder === 'sent' || m.folder === 'outbox';
    var to = this.recipientsLabel(m.to), cc = this.recipientsLabel(m.cc);
    var html = '<article class="rp-msg">';
    if (single) html += '<button type="button" class="rp-back" data-act="back" data-t="rp-back">' + I('chev-left', 14) + ' Back to list</button>';
    html += '<header class="rp-head"><h2 class="rp-subj">' + esc(m.subject) + '</h2>' +
      '<div class="rp-meta"><span class="av lg" style="background:' + U.colorFor(c.name) + '" aria-hidden="true">' + esc(U.initials(c.name)) + '</span>' +
      '<div class="rp-who"><div class="rp-name"><b>' + esc(c.name) + '</b> <span class="rp-mail">&lt;' + esc(c.email) + '&gt;</span></div>' +
      '<div class="rp-to">To: ' + esc(to || '—') + (cc ? ' &nbsp; Cc: ' + esc(cc) : '') + '</div></div>' +
      '<div class="rp-date">' + esc(U.fmtDate(new Date(m.date)) + ' ' + U.fmtTime(new Date(m.date))) + '</div></div>';
    html += '<div class="rp-actions" role="toolbar" aria-label="Message actions">' +
      '<button type="button" class="rpb" data-act="reply" data-id="' + m.id + '" data-t="rp-reply" aria-label="Reply">' + I('reply', 16) + '<span>Reply</span></button>' +
      '<button type="button" class="rpb" data-act="replyall" data-id="' + m.id + '" data-t="rp-replyall" aria-label="Reply all">' + I('reply-all', 16) + '<span>Reply all</span></button>' +
      '<button type="button" class="rpb" data-act="forward" data-id="' + m.id + '" data-t="rp-forward" aria-label="Forward">' + I('forward', 16) + '<span>Forward</span></button></div></header>';
    if (m.scheduledFor) html += '<div class="note-banner">' + I('clock', 14) + ' Scheduled to send ' + esc(m.scheduledFor) + '</div>';
    if (m.deliverAt) html += '<div class="note-banner">' + I('clock', 14) + ' Delayed delivery: this message will not be delivered before ' + esc(m.deliverAt) + '. It stays in the Outbox until then.</div>';
    if (m.inviteId) html += this.tplInvite(m);
    if (m.attachments.length) {
      html += '<div class="atts" aria-label="Attachments">' + m.attachments.map(function (a) {
        return '<button type="button" class="att" data-act="att" data-id="' + m.id + '" data-arg="' + a.id + '" data-t="att-' + a.id + '" aria-haspopup="menu" aria-expanded="false" aria-label="Attachment ' + esc(a.name) + ', ' + U.fmtSize(a.size) + '">' + self.fileIcon(a.ext) + '<span class="att-t"><b>' + esc(a.name) + '</b><small>' + U.fmtSize(a.size) + '</small></span>' + I('chev-down', 12) + '</button>';
      }).join('') + '</div>';
    }
    html += '<div class="rp-body">' + m.body + '</div></article>';
    return html;
  };

  /* ---------------------------------------------------------------- calendar */
  S.weekDays = function () {
    var ui = this.ui, d = new Date(ui.calDate), out = [];
    if (ui.calView === 'day') return [new Date(d.getFullYear(), d.getMonth(), d.getDate())];
    var dow = d.getDay(), mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (dow === 0 ? 6 : dow - 1));
    var n = ui.calView === 'week' ? 7 : 5;
    for (var i = 0; i < n; i++) out.push(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + i));
    return out;
  };

  S.tplCalendar = function () {
    var ui = this.ui, self = this, days = this.weekDays(), isNew = this.isNew(), cfg = this.cfg();
    var H0 = 7, H1 = 19, HH = 46;
    var first = days[0], last = days[days.length - 1];
    var title = ui.calView === 'day' ? U.fmtDate(first) : U.MONTHS_LONG[first.getMonth()] + ' ' + first.getDate() + ' – ' + (last.getMonth() !== first.getMonth() ? U.MONTHS_LONG[last.getMonth()] + ' ' : '') + last.getDate() + ', ' + last.getFullYear();
    var html = '<div class="cal"><div class="cal-head"><div class="cal-nav"><button type="button" class="cn" data-act="cal-nav" data-arg="-1" data-t="cal-prev" aria-label="Previous ' + (ui.calView === 'day' ? 'day' : 'week') + '">' + I('chev-left', 16) + '</button>' +
      '<button type="button" class="cn" data-act="cal-nav" data-arg="1" data-t="cal-next" aria-label="Next ' + (ui.calView === 'day' ? 'day' : 'week') + '">' + I('chev-right', 16) + '</button>' +
      '<button type="button" class="cn txt" data-act="cal-today" data-t="cal-today">Today</button></div><h2 class="cal-title">' + title + '</h2></div>';
    html += '<div class="cal-scroll"><div class="cal-grid" style="--cols:' + days.length + ';--hh:' + HH + 'px">';
    html += '<div class="cg-corner"></div>';
    days.forEach(function (d) {
      var isToday = U.sameDay(d, new Date(OT.data.NOW));
      html += '<div class="cg-dayhead' + (isToday ? ' today' : '') + '"><span>' + U.DAYS[d.getDay()] + '</span><b>' + d.getDate() + '</b></div>';
    });
    html += '<div class="cg-times">';
    for (var h = H0; h < H1; h++) html += '<div class="cg-time"><span>' + ((h % 12) || 12) + ' ' + (h < 12 ? 'AM' : 'PM') + '</span></div>';
    html += '</div>';
    days.forEach(function (d) {
      html += '<div class="cg-col" role="group" aria-label="' + esc(U.fmtDate(d)) + '">';
      for (var h = H0; h < H1; h++) {
        var work = h >= cfg.workStart && h < cfg.workEnd;
        var start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h).getTime();
        html += '<button type="button" class="slot' + (work ? ' work' : '') + '" data-act="cal-slot" data-start="' + start + '" aria-label="New event ' + esc(U.fmtShort(d) + ' ' + ((h % 12) || 12) + (h < 12 ? ' AM' : ' PM')) + '" tabindex="-1" data-t="slot-' + U.isoDate(d) + '-' + h + '"></button>';
      }
      self.s.events.filter(function (ev) {
        if (!U.sameDay(new Date(ev.start), d)) return false;
        if (ev.status === 'declined') return isNew && cfg.showDeclined;
        return true;
      }).forEach(function (ev) {
        var s = new Date(ev.start), e = new Date(ev.end);
        var top = ((s.getHours() + s.getMinutes() / 60) - H0) * HH, hgt = Math.max(20, ((e - s) / 3600000) * HH - 2);
        html += '<button type="button" class="ev st-' + ev.status + '" style="top:' + top + 'px;height:' + hgt + 'px" data-act="event-open" data-id="' + ev.id + '" data-t="ev-' + ev.id + '" aria-label="' + esc(ev.title + ', ' + U.fmtTime(s) + ' to ' + U.fmtTime(e) + (ev.status === 'pending' ? ', not responded' : ev.status === 'declined' ? ', declined' : '')) + '"><b>' + esc(ev.title) + '</b><span>' + U.fmtTime(s) + '</span></button>';
      });
      html += '</div>';
    });
    html += '</div></div>';
    var sel = ui.selEvent ? this.event(ui.selEvent) : null;
    if (sel) html += this.tplEventDetail(sel);
    return html + '</div>';
  };

  S.tplEventDetail = function (ev) {
    var self = this, s = new Date(ev.start), e = new Date(ev.end), conf = this.conflictsFor(ev);
    var att = ev.attendees.map(function (a) {
      var r = { accepted: 'Accepted', tentative: 'Tentative', declined: 'Declined', none: 'No response' }[a.resp] || a.resp;
      return '<li><span>' + esc(self.name(a.id)) + (a.type === 'optional' ? ' (optional)' : '') + '</span><em>' + r + '</em></li>';
    }).join('');
    var mine = ev.organizer !== 'jordan' && ev.attendees.some(function (a) { return a.id === 'jordan'; });
    var rs = mine ? ['accepted', 'tentative', 'declined'].map(function (r) {
      var label = { accepted: 'Accept', tentative: 'Tentative', declined: 'Decline' }[r];
      return '<button type="button" class="inv-btn ' + r + (ev.status === r ? ' chosen' : '') + '" data-act="rsvp" data-id="' + ev.id + '" data-arg="' + r + '" data-t="rsvp-' + { accepted: 'accept', tentative: 'tentative', declined: 'decline' }[r] + '">' + label + (self.isNew() ? '' : ' ' + I('chev-down', 10)) + '</button>';
    }).join('') : '';
    return '<div class="evd" role="dialog" aria-label="Event details" data-t="event-detail"><div class="evd-h"><b>' + esc(ev.title) + '</b><button type="button" class="x" data-act="event-close" aria-label="Close details" data-t="event-close">' + I('x', 14) + '</button></div>' +
      '<div class="evd-l">' + I('clock', 13) + ' ' + esc(U.fmtDate(s) + ', ' + U.fmtTime(s) + ' – ' + U.fmtTime(e)) + '</div>' +
      '<div class="evd-l">' + I(ev.teams ? 'video' : 'location', 13) + ' ' + esc(ev.location || 'No location') + (ev.teams ? ' <small>(Microsoft Teams meeting)</small>' : '') + '</div>' +
      '<div class="evd-l">' + I('user', 13) + ' Organizer: ' + esc(this.name(ev.organizer)) + '</div>' +
      (conf.length && ev.status !== 'declined' ? '<div class="inv-conf" role="alert">' + I('flag', 13) + ' Conflicts with: ' + conf.map(function (c) { return esc(c.title); }).join(', ') + '</div>' : '') +
      (att ? '<ul class="evd-att" aria-label="Attendees">' + att + '</ul>' : '') +
      (rs ? '<div class="inv-actions">' + rs + '</div>' : '') +
      '<div class="evd-foot"><button type="button" class="btn danger" data-act="event-delete" data-id="' + ev.id + '" data-t="event-delete">' + I('trash', 13) + ' ' + (ev.organizer === 'jordan' ? 'Cancel meeting' : 'Delete') + '</button></div></div>';
  };

  S.openEventDetails = function (id, el) {
    this.ui.selEvent = id;
    this.emit('event-open', { id: id });
    this.render();
  };

  S.tplSide = function () {
    if (!this.isNew() || !this.ui.myday) return '';
    var self = this, today = new Date(OT.data.NOW);
    var evs = this.s.events.filter(function (e) { return U.sameDay(new Date(e.start), today) && e.status !== 'declined'; }).sort(function (a, b) { return a.start - b.start; });
    return '<div class="side-h"><b>My Day</b><button type="button" class="x" data-act="myday" aria-label="Close My Day" data-t="myday-close">' + I('x', 14) + '</button></div><div class="side-d">' + U.fmtDate(today) + '</div>' +
      (evs.length ? '<ul class="side-l">' + evs.map(function (e) { return '<li><span class="t">' + U.fmtTime(new Date(e.start)) + '</span><span>' + esc(e.title) + '</span></li>'; }).join('') + '</ul>' : '<p class="side-e">No events today.</p>');
  };

  /* ------------------------------------------------------------------ people */
  S.tplPeople = function () {
    var ui = this.ui, self = this, q = ui.peopleQuery.toLowerCase();
    var list = Object.keys(this.s.contacts).map(function (k) { return self.s.contacts[k]; }).filter(function (c) { return c.id !== 'jordan' && (!q || (c.name + ' ' + c.email + ' ' + c.title).toLowerCase().indexOf(q) !== -1); }).sort(function (a, b) { return a.name.localeCompare(b.name); });
    var sel = ui.peopleSel ? this.contact(ui.peopleSel) : null;
    var rows = list.map(function (c) {
      return '<button type="button" class="prow' + (sel && sel.id === c.id ? ' on' : '') + '" data-act="people-select" data-id="' + c.id + '" data-t="pp-' + c.id + '"><span class="av" style="background:' + U.colorFor(c.name) + '" aria-hidden="true">' + esc(U.initials(c.name)) + '</span><span class="pr-t"><b>' + esc(c.name) + '</b><small>' + esc(c.title) + '</small></span></button>';
    }).join('');
    var detail = sel ? '<div class="pdet"><span class="av xl" style="background:' + U.colorFor(sel.name) + '" aria-hidden="true">' + esc(U.initials(sel.name)) + '</span><h2>' + esc(sel.name) + '</h2><p>' + esc(sel.title) + (sel.dept ? ' · ' + esc(sel.dept) : '') + '</p><dl><dt>Email</dt><dd>' + esc(sel.email) + '</dd>' + (sel.phone ? '<dt>Phone</dt><dd>' + esc(sel.phone) + '</dd>' : '') + '</dl>' +
      '<div class="pd-act"><button type="button" class="btn primary" data-act="people-mail" data-id="' + sel.id + '" data-t="pd-mail">' + I('mail', 14) + ' Send email</button><button type="button" class="btn" data-act="people-meet" data-id="' + sel.id + '" data-t="pd-meet">' + I('calendar-add', 14) + ' Schedule meeting</button></div></div>'
      : '<div class="rp-empty">' + I('people', 40) + '<p>Select a contact</p><small>Contact details appear here</small></div>';
    return '<div class="people"><section class="plist" aria-label="Contacts"><div class="p-search"><input id="sim-people-q" type="search" placeholder="Search contacts" aria-label="Search contacts" value="' + esc(ui.peopleQuery) + '"></div><div class="p-rows">' + rows + '</div></section><section class="pdetail" aria-label="Contact details">' + detail + '</section></div>';
  };
})();

</script>
<script>
/* ==========================================================================
   sim-forms.js — compose window, meeting form, settings, backstage, dialogs
   Classic Outlook opens messages/meetings in separate windows and uses the
   File tab + dialogs. New Outlook composes inline and uses a Settings pane.
   ========================================================================== */
(function () {
  'use strict';
  var OT = window.OT, U = OT.util, I = OT.icon, S = OT.Sim.prototype, esc = U.esc;

  function htmlToText(h) {
    return String(h).replace(/<br\s*\/?>/gi, '\n').replace(/<\/p>/gi, '\n\n').replace(/<[^>]+>/g, '')
      .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
  }
  OT.util.htmlToText = htmlToText;

  S.slots = function () {
    if (!this.dSlots || !this.el.dialog.contains(this.dSlots.dlg)) {
      this.el.dialog.innerHTML = '<div class="bs-slot"></div><div class="dlg-slot"></div>';
      this.dSlots = { bs: this.el.dialog.querySelector('.bs-slot'), dlg: this.el.dialog.querySelector('.dlg-slot') };
    }
    return this.dSlots;
  };
  S.clearOverlays = function () {
    this.el.dialog.innerHTML = ''; this.dSlots = null;
    this.ui.dialog = null; this.ui.settings = null; this.ui.backstage = null;
    this.el.sim.classList.remove('has-dialog');
  };

  /* ---------------------------------------------------------------- helpers */
  S.rcptFor = function (v) {
    if (typeof v === 'object' && v) return v;
    var c = this.contact(v);
    if (c) return { id: c.id, name: c.name, email: c.email };
    return { id: null, name: String(v), email: String(v) };
  };
  S.storedRcpt = function (r) { return r.id ? r.id : { name: r.email, email: r.email }; };
  S.matchContacts = function (q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return [];
    var self = this;
    return Object.keys(this.s.contacts).map(function (k) { return self.s.contacts[k]; }).filter(function (c) {
      return c.id !== 'jordan' && (c.name.toLowerCase().indexOf(q) !== -1 || c.email.toLowerCase().indexOf(q) !== -1);
    }).slice(0, 5);
  };
  S.F = function () { return this.ui.compose || this.ui.evform; };
  S.dq = function (sel) { return this.el.dialog.querySelector(sel); };
  S.cq = function (sel) { return this.el.compose.querySelector(sel); };

  /* --------------------------------------------------------------- compose */
  S.signatureText = function () { var s = this.cfg().signature; return s ? '\n\n' + s : ''; };

  S.quotedHeader = function (m) {
    var c = this.contact(m.from) || { name: m.from, email: '' }, self = this;
    return '\n\n________________________________\nFrom: ' + c.name + ' <' + c.email + '>\nSent: ' + U.fmtDate(new Date(m.date)) + ' ' + U.fmtTime(new Date(m.date)) +
      '\nTo: ' + this.recipientsLabel(m.to) + (m.cc && m.cc.length ? '\nCc: ' + this.recipientsLabel(m.cc) : '') + '\nSubject: ' + m.subject + '\n\n' + htmlToText(m.body);
  };

  S.openCompose = function (o) {
    if (this.ui.compose || this.ui.evform) this.closeCompose(true);
    this.closeMenu();
    var kind = o.kind || 'new', src = o.source ? this.msg(o.source) : null, self = this;
    var c = { kind: kind, sourceId: o.source || null, to: [], cc: [], subject: '', body: '', attachments: [], draftId: null, deliverAt: null, important: false, tab: 'message', ccShown: false, error: '', pend: { to: '', cc: '' } };
    if (o.restore) {
      for (var k in o.restore) c[k] = o.restore[k];
    } else if (src) {
      var base = src.subject.replace(/^((re|fw|fwd):\s*)+/i, '');
      if (kind === 'reply' || kind === 'replyall') {
        c.to = [this.rcptFor(src.from)];
        c.subject = 'RE: ' + base;
        if (kind === 'replyall') {
          (src.to || []).forEach(function (r) {
            var rr = self.rcptFor(r);
            if (rr.id !== 'jordan' && !c.to.some(function (x) { return x.email === rr.email; })) c.to.push(rr);
          });
          (src.cc || []).forEach(function (r) {
            var rr = self.rcptFor(r);
            if (rr.id !== 'jordan') c.cc.push(rr);
          });
          c.ccShown = c.cc.length > 0;
        }
      } else if (kind === 'forward') {
        c.subject = 'FW: ' + base;
        c.attachments = src.attachments.map(function (a) { return U.clone(a); });
      }
      c.body = this.signatureText() + this.quotedHeader(src);
    } else {
      (o.to || []).forEach(function (r) { c.to.push(self.rcptFor(r)); });
      c.body = this.signatureText();
    }
    c.initialBody = c.body;
    this.ui.compose = c;
    this.renderCompose();

<script>
/* ==========================================================================
   lessons.js — lesson content and step validation rules (data only)

   Step fields
     id      unique within the lesson
     part    'classic' | 'new'   (the simulator is switched to this mode when the step starts)
     title   short label
     do      instruction (HTML allowed)
     target  data-t keys to highlight. An array is a path: the LAST key currently on screen is
             highlighted (e.g. ['tab-view','b-readingpane','rp-bottom']). May be a function(sim).
     callout short bubble text next to the highlight
     done    function(event, sim) -> true when the learner really performed the action
             (also polled with event === null so state-based checks work)
     wrong   function(event, sim) -> feedback string when a recognisable mistake happens
     hint    shown on request (and automatically after 2 mistakes or ~25s idle)
     why     "what to remember" shown after success; steps without it advance automatically
     auto    function(sim) run once when the step starts (used to pre-fill a message)
     free    true = do not force the part's mode (used by the toggle lesson)
   Question steps: { type:'q', q, options:[...], answer:index, why }
   ========================================================================== */

  var OT = window.OT;

      if (sim.ui.sel !== id) return ['row-' + id];
      if (tab && sim.ui.tab !== tab && !sim.ui.menu) return ['tab-' + tab];
      return path;

<script>
/* ==========================================================================
   engine.js — guided lesson runner
   Watches the simulator's event bus, validates the learner's real actions
   against each step, highlights the control to use, and renders the coach
   panel. Nothing is marked done unless the check function passes.
   ========================================================================== */
(function () {
  'use strict';
  var OT = window.OT, U = OT.util, I = OT.icon, esc = U.esc;

  var IGNORE = { 'click-target': 1, 'menu-open': 0, 'sim-rendered': 1 };
  var PART_LABEL = { classic: 'Classic Outlook', 'new': 'New Outlook' };

  function Runner(o) {
    this.sim = o.sim; this.lesson = o.lesson; this.coach = o.coach; this.cb = o.callbacks || {};
    this.steps = this.lesson.steps; this.idx = 0; this.state = 'active';
    this.doneIds = {}; this.stats = { wrong: 0, hints: 0, qWrong: 0 };
    this.stepWrong = 0; this.hintShown = false; this.fb = null; this.qSel = null; this.qState = null;
    this.muted = false; this.destroyed = false; this.lastKey = '';
    this.bind();
  }
  OT.Runner = Runner;
  var R = Runner.prototype;

  R.bind = function () {
    var self = this;
    this.onSim = function (e) { self.handle(e); };
    OT.bus.on('sim', this.onSim);
    this.onRend = function () { self.schedule(); };
    OT.bus.on('sim-rendered', this.onRend);
    this.poll = setInterval(function () {
      self.handle(null);
      var k = JSON.stringify(self.targetKeys());
      if (k !== self.keysSig) { self.keysSig = k; self.schedule(); }
    }, 300);
    this.onField = function () { self.schedule(); };
    this.sim.root.addEventListener('input', this.onField);
    this.sim.root.addEventListener('change', this.onField);
    this.mo = new MutationObserver(function (list) {
      for (var i = 0; i < list.length; i++) {
        var t = list[i].target;
        if (t && t.closest && t.closest('.sim-callout-host')) continue;
        self.schedule(); return;
      }
    });
    this.mo.observe(this.sim.root, { childList: true, subtree: true });
    this.onResize = function () { self.schedule(); };
    window.addEventListener('resize', this.onResize);
    this.coach.addEventListener('click', function (e) { self.onCoachClick(e); });
    this.coach.addEventListener('change', function (e) { if (e.target.name === 'q-opt') { self.qSel = +e.target.value; } });
  };

  R.destroy = function () {
    this.destroyed = true;
    OT.bus.off('sim', this.onSim); OT.bus.off('sim-rendered', this.onRend);
    clearInterval(this.poll); clearTimeout(this.idle); clearTimeout(this.adv);
    if (this.mo) this.mo.disconnect();
    this.sim.root.removeEventListener('input', this.onField); this.sim.root.removeEventListener('change', this.onField);
    window.removeEventListener('resize', this.onResize);
    this.clearHighlight();
    this.sim.el.callout.innerHTML = '';
  };

  /* ---------------------------------------------------------------- flow */
  R.step = function () { return this.steps[this.idx]; };

  R.start = function (i) {
    var first = this.steps[0];
    this.idx = i || 0;
    this.doneIds = {};
    this.stats = { wrong: 0, hints: 0, qWrong: 0 };
    this.sim.reset({ mode: first.mode || 'classic' });
    this.enter();
  };

  R.enter = function () {
    var st = this.step(), sim = this.sim;
    clearTimeout(this.idle); clearTimeout(this.adv);
    this.state = 'active'; this.stepWrong = 0; this.hintShown = false; this.fb = null; this.qSel = null; this.qState = null; this.modeNote = null;
    if (st.type !== 'q' && st.mode && !st.free && sim.ui.mode !== st.mode) {
      this.muted = true; sim.setMode(st.mode); this.muted = false;
      this.modeNote = 'Switched to ' + PART_LABEL[st.mode] + ' for this part of the lesson.';
    }
    if (st.auto) { this.muted = true; try { st.auto(sim); } catch (err) { if (window.console) console.error(err); } this.muted = false; }
    this.lastKey = '';
    this.render();
    var self = this;
    this.idle = setTimeout(function () { if (self.state === 'active' && !self.hintShown) { self.showHint(true); } }, 25000);
    if (this.cb.onProgress) this.cb.onProgress({ index: this.idx, total: this.steps.length, done: Object.keys(this.doneIds).length });
  };

  R.handle = function (e) {
    if (this.destroyed || this.muted || this.state !== 'active') return;
    var st = this.step(); if (st.type === 'q') return;
    if (e && IGNORE[e.type]) return;
    var sim = this.sim, ok = false;
    try { ok = st.done(e, sim); } catch (err) { ok = false; }
    if (ok) { this.complete(); return; }
    if (e && st.wrong) {
      var msg = null; try { msg = st.wrong(e, sim); } catch (err2) { msg = null; }
      if (msg) { this.stepWrong++; this.stats.wrong++; this.fb = { kind: 'wrong', text: msg }; if (this.stepWrong >= 2 && !this.hintShown) this.showHint(true); this.renderFeedback(); return; }
    }
    if (!e) this.checkMode();
  };

  R.checkMode = function () {
    var st = this.step(); if (!st || st.type === 'q' || st.free) return;
    var bad = st.mode && this.sim.ui.mode !== st.mode;
    var has = !!this.coach.querySelector('.coach-mode');
    if (bad !== has) this.renderFeedback();
  };

  R.complete = function () {
    var st = this.step();
    this.state = 'done'; this.doneIds[st.id || this.idx] = true;
    clearTimeout(this.idle);
    this.fb = null;
    if (this.cb.onProgress) this.cb.onProgress({ index: this.idx, total: this.steps.length, done: Object.keys(this.doneIds).length });
    this.clearHighlight();
    if (st.why) { this.render(); var b = this.coach.querySelector('[data-c="next"]'); if (b) b.focus(); }
    else { this.render(); var self = this; this.adv = setTimeout(function () { self.next(); }, 650); }
  };

  R.next = function () {
    clearTimeout(this.adv);
    if (this.idx >= this.steps.length - 1) { this.finish(); return; }
    this.idx++; this.enter();
  };

  R.finish = function () {
    this.state = 'finished'; this.clearHighlight();
    this.render();
    if (this.cb.onComplete) this.cb.onComplete({ wrong: this.stats.wrong + this.stats.qWrong, hints: this.stats.hints });
  };

  R.showHint = function (auto) {
    if (this.hintShown) return;
    this.hintShown = true; if (!auto) this.stats.hints++; else this.stats.hints++;
    this.renderHint();
  };

  /* ------------------------------------------------------------ questions */
  R.checkQuestion = function () {
    var st = this.step();
    if (this.qSel === null) { this.fb = { kind: 'wrong', text: 'Choose an answer first.' }; this.renderFeedback(); return; }
    if (this.qSel === st.answer) { this.qState = 'right'; this.complete(); }
    else {
      this.stepWrong++; this.stats.qWrong++;
      this.fb = { kind: 'wrong', text: 'Not quite. ' + (this.stepWrong >= 2 ? 'The correct answer is highlighted below.' : 'Read the options again and try once more.') };
      if (this.stepWrong >= 2) this.qState = 'reveal';
      this.render();
    }
  };

  R.onCoachClick = function (e) {
    var b = e.target.closest('[data-c]'); if (!b) return;
    var c = b.getAttribute('data-c');
    if (c === 'next') this.next();
